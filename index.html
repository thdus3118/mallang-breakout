<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>말랑 벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 15%, #fff0f6 0%, #ffe1ee 40%, #e6e9ff 100%);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: 'Jua', sans-serif;
  }
  canvas {
    display: block; border-radius: 26px; touch-action: none;
    box-shadow: 0 10px 0 #f3b6cc, 0 18px 40px rgba(150, 90, 140, .25);
    cursor: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const W = 480, H = 720;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let scale = 1;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    scale = Math.min(innerWidth * 0.96 / W, innerHeight * 0.96 / H);
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ---------- 상수 ----------
  const INK = '#5b4660';
  const PAL = ['#ffadc6', '#ffc8a2', '#ffe58f', '#b9f3b0', '#a8e6ff', '#c5b8ff', '#ffc2f0'];
  const FONT = '"Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  const TOP_WALL = 70;
  const LEVELS = [
    ['.22..22.', '11111111', '11111111', '.111111.', '..1111..', '...11...'],
    ['1......1', '11....11', '11111111', '12111121', '11111111', '11122111', '.111111.'],
    ['22222222', '11111111', '1.1.1.1.', '.1.1.1.1', '11111111', '2.2..2.2', '11111111'],
    ['..1111..', '.111111.', '11211211', '11111111', '21111112', '.211112.', '..2222..'],
  ];
  const NOTES = [523, 587, 659, 784, 880, 1047];

  // ---------- 상태 ----------
  let state = 'title';           // title | play | pause | clear | over
  let score = 0, best = 0, lives = 3, level = 0, stateT = 0, time = 0, shake = 0;
  let bricks = [], balls = [], items = [], parts = [], texts = [];
  const paddle = { x: W / 2, w: 96, tw: 96, h: 20, y: H - 72, big: 0 };
  const keys = {};
  let targetX = null, muted = false;
  const clouds = Array.from({ length: 5 }, (_, i) => ({
    x: Math.random() * W, y: 110 + i * 120 + Math.random() * 40, s: 0.6 + Math.random() * 0.7, v: 6 + Math.random() * 10,
  }));
  try { best = +localStorage.getItem('mallang-best') || 0; } catch (e) {}

  // ---------- 사운드 ----------
  let actx = null;
  function tone(f, d = 0.1, type = 'sine', v = 0.07, slide = 0, delay = 0) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  const sfx = {
    brick: () => tone(NOTES[Math.floor(Math.random() * NOTES.length)], 0.12, 'triangle', 0.08, 1.5),
    paddle: () => tone(392, 0.09, 'sine', 0.09, 1.7),
    wall: () => tone(720, 0.04, 'sine', 0.03),
    power: () => [659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'triangle', 0.07, 1, i * 0.07)),
    lose: () => tone(420, 0.45, 'triangle', 0.09, 0.45),
    clear: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, 'triangle', 0.07, 1, i * 0.09)),
  };

  // ---------- 게임 흐름 ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const speed = () => 340 + level * 28;

  function buildLevel() {
    const map = LEVELS[level % LEVELS.length];
    const cols = 8, gap = 6, mx = 24, bh = 28, top = 96;
    const bw = (W - mx * 2 - gap * (cols - 1)) / cols;
    bricks = [];
    map.forEach((row, r) => [...row].forEach((ch, c) => {
      if (ch === '.') return;
      bricks.push({
        x: mx + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh,
        hp: ch === '2' ? 2 : 1, tough: ch === '2', color: PAL[r % PAL.length], hit: 0, blink: Math.random() * 4,
      });
    }));
  }

  function newBall() {
    balls = [{ x: paddle.x, y: paddle.y - 10, vx: 0, vy: 0, r: 10, stuck: true, trail: [] }];
  }

  function launch() {
    for (const b of balls) {
      if (!b.stuck) continue;
      b.stuck = false;
      const a = Math.random() * 0.6 - 0.3, s = speed();
      b.vx = s * Math.sin(a); b.vy = -s * Math.cos(a);
    }
  }

  function startGame() {
    score = 0; lives = 3; level = 0;
    paddle.big = 0; items = []; parts = []; texts = [];
    buildLevel(); newBall();
    state = 'play';
  }

  function loseLife() {
    lives--; shake = 0.35; sfx.lose();
    items = []; paddle.big = 0;
    if (lives <= 0) {
      state = 'over';
      if (score > best) { best = score; try { localStorage.setItem('mallang-best', best); } catch (e) {} }
    } else newBall();
  }

  function burst(x, y, color, n = 9) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.9, max: 0.9,
        color: Math.random() < 0.3 ? '#fff' : color, heart: Math.random() < 0.4, size: 4 + Math.random() * 4 });
    }
  }

  function popText(x, y, text, color = INK) { texts.push({ x, y, text, color, t: 0.9 }); }

  function damage(br) {
    br.hp--; br.hit = 0.18;
    sfx.brick();
    if (br.hp > 0) { burst(br.x + br.w / 2, br.y + br.h / 2, '#fff', 5); return; }
    bricks.splice(bricks.indexOf(br), 1);
    const pts = br.tough ? 20 : 10;
    score += pts;
    burst(br.x + br.w / 2, br.y + br.h / 2, br.color);
    popText(br.x + br.w / 2, br.y + br.h / 2, '+' + pts);
    if (Math.random() < 0.14) {
      const r = Math.random();
      items.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, type: r < 0.25 ? 'heart' : r < 0.6 ? 'star' : 'fish', t: 0 });
    }
    if (!bricks.length) {
      state = 'clear'; stateT = 2; score += 100; sfx.clear();
      for (let i = 0; i < 6; i++) burst(60 + Math.random() * (W - 120), 200 + Math.random() * 200, PAL[i % PAL.length], 12);
    }
  }

  function collideBrick(b) {
    for (const br of bricks) {
      const cx = clamp(b.x, br.x, br.x + br.w), cy = clamp(b.y, br.y, br.y + br.h);
      if ((b.x - cx) ** 2 + (b.y - cy) ** 2 < b.r * b.r) return br;
    }
    return null;
  }

  function applyItem(it) {
    sfx.power();
    if (it.type === 'heart') {
      lives = Math.min(5, lives + 1); popText(paddle.x, paddle.y - 20, '생명 +1 ♥', '#ff6f9c');
    } else if (it.type === 'fish') {
      paddle.big = 10; popText(paddle.x, paddle.y - 20, '냠! 커졌다', '#4aa8d8');
    } else {
      const free = balls.filter(b => !b.stuck);
      if (!free.length) { launch(); return; }
      for (const b of free) {
        for (const d of [-0.45, 0.45]) {
          if (balls.length >= 8) break;
          const c = Math.cos(d), s = Math.sin(d);
          balls.push({ x: b.x, y: b.y, r: b.r, stuck: false, trail: [], vx: b.vx * c - b.vy * s, vy: b.vx * s + b.vy * c });
        }
      }
      popText(paddle.x, paddle.y - 20, '말랑이 분신술!', '#e0a800');
    }
  }

  // ---------- 업데이트 ----------
  function update(dt) {
    time += dt;
    shake = Math.max(0, shake - dt);
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 80) c.x = -80; }
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const t of texts) { t.y -= 40 * dt; t.t -= dt; }
    texts = texts.filter(t => t.t > 0);
    for (const br of bricks) {
      br.hit = Math.max(0, br.hit - dt);
      br.blink -= dt;
      if (br.blink < -0.15) br.blink = 2 + Math.random() * 4;
    }

    if (state === 'clear') {
      stateT -= dt;
      if (stateT <= 0) { level++; buildLevel(); newBall(); items = []; paddle.big = 0; state = 'play'; }
      return;
    }
    if (state !== 'play') return;

    // 패들
    const kx = (keys.ArrowLeft || keys.a ? -1 : 0) + (keys.ArrowRight || keys.d ? 1 : 0);
    if (kx) { paddle.x += kx * 560 * dt; targetX = null; }
    else if (targetX !== null) paddle.x += (targetX - paddle.x) * Math.min(1, dt * 18);
    if (paddle.big > 0) paddle.big -= dt;
    paddle.tw = paddle.big > 0 ? 150 : 96;
    paddle.w += (paddle.tw - paddle.w) * Math.min(1, dt * 10);
    paddle.x = clamp(paddle.x, paddle.w / 2 + 6, W - paddle.w / 2 - 6);

    // 공
    for (const b of balls) {
      if (b.stuck) { b.x = paddle.x; b.y = paddle.y - b.r; continue; }
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 7) b.trail.shift();
      const steps = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 4);
      for (let i = 0; i < steps && state === 'play'; i++) {
        const dx = b.vx * dt / steps;
        b.x += dx;
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); sfx.wall(); }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); sfx.wall(); }
        let br = collideBrick(b);
        if (br) { b.x -= dx; b.vx = -b.vx; damage(br); }

        const dy = b.vy * dt / steps;
        b.y += dy;
        if (b.y < TOP_WALL + b.r) { b.y = TOP_WALL + b.r; b.vy = Math.abs(b.vy); sfx.wall(); }
        br = state === 'play' && collideBrick(b);
        if (br) { b.y -= dy; b.vy = -b.vy; damage(br); }

        const pw = paddle.w;
        if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
            b.x >= paddle.x - pw / 2 - b.r && b.x <= paddle.x + pw / 2 + b.r) {
          const t = clamp((b.x - paddle.x) / (pw / 2), -1, 1);
          const a = t * 1.05, s = speed();
          b.vx = s * Math.sin(a); b.vy = -s * Math.cos(a);
          b.y = paddle.y - b.r;
          sfx.paddle();
        }
      }
    }
    if (state !== 'play') return;
    balls = balls.filter(b => b.y < H + 30);
    if (!balls.length) { loseLife(); return; }

    // 아이템
    for (const it of items) {
      it.y += 150 * dt; it.t += dt;
      if (it.y + 14 >= paddle.y && it.y - 14 <= paddle.y + paddle.h && Math.abs(it.x - paddle.x) < paddle.w / 2 + 14) {
        it.got = true; applyItem(it);
      }
    }
    items = items.filter(it => !it.got && it.y < H + 30);
  }

  // ---------- 그리기 도우미 ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x - s * 0.55, y - s * 0.05, x - s * 0.28, y - s * 0.5, x, y - s * 0.15);
    ctx.bezierCurveTo(x + s * 0.28, y - s * 0.5, x + s * 0.55, y - s * 0.05, x, y + s * 0.35);
    ctx.closePath();
  }
  function starPath(x, y, R, r = R * 0.5) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r : R;
      ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
    }
    ctx.closePath();
  }
  function label(text, x, y, size, color = INK, align = 'center', outline = true) {
    ctx.font = `${size}px ${FONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    if (outline) { ctx.lineWidth = size / 5; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round'; ctx.strokeText(text, x, y); }
    ctx.fillStyle = color; ctx.fillText(text, x, y);
  }
  function face(x, y, r, blink = false) {
    ctx.fillStyle = 'rgba(255,140,170,.55)';
    ctx.beginPath(); ctx.ellipse(x - r * 0.58, y + r * 0.22, r * 0.2, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + r * 0.58, y + r * 0.22, r * 0.2, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineCap = 'round';
    if (blink) {
      ctx.lineWidth = Math.max(1.5, r * 0.1);
      ctx.beginPath();
      ctx.moveTo(x - r * 0.45, y - r * 0.08); ctx.lineTo(x - r * 0.22, y - r * 0.08);
      ctx.moveTo(x + r * 0.22, y - r * 0.08); ctx.lineTo(x + r * 0.45, y - r * 0.08);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x - r * 0.34, y - r * 0.1, r * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.34, y - r * 0.1, r * 0.13, 0, Math.PI * 2); ctx.fill();
    }
    ctx.lineWidth = Math.max(1.3, r * 0.08);
    ctx.beginPath(); ctx.arc(x, y + r * 0.12, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }

  // ---------- 그리기 ----------
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#fff3f8'); g.addColorStop(1, '#eef1ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (const c of clouds) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
      ctx.beginPath();
      ctx.arc(-26, 6, 18, 0, Math.PI * 2); ctx.arc(0, -4, 26, 0, Math.PI * 2); ctx.arc(28, 6, 18, 0, Math.PI * 2);
      ctx.fill(); rr(-44, 4, 90, 20, 10); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,190,215,.6)';
    for (let i = 0; i < 14; i++) {
      const x = (i * 97) % W + 10, y = 90 + (i * 173) % (H - 140);
      const tw = 2 + Math.sin(time * 2 + i) * 1.2;
      starPath(x, y, tw + 2, tw * 0.6); ctx.fill();
    }
  }

  function drawBrick(br) {
    const k = br.hit > 0 ? Math.sin(br.hit / 0.18 * Math.PI) * 0.14 : 0;
    const cx = br.x + br.w / 2, cy = br.y + br.h / 2, w = br.w, h = br.h;
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(1 + k, 1 - k);
    ctx.fillStyle = 'rgba(91,70,96,.13)'; rr(-w / 2, -h / 2 + 4, w, h, 10); ctx.fill();
    ctx.fillStyle = br.color; rr(-w / 2, -h / 2, w, h, 10); ctx.fill();
    ctx.save(); rr(-w / 2, -h / 2, w, h, 10); ctx.clip();
    if (br.hp > 1) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(-w / 2, -h / 2, w, 8);
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-w / 2 + 5 + i * (w - 10) / 4, -h / 2 + 8, 3.6, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#ff7aa8';
      for (let i = 0; i < 4; i++) ctx.fillRect(-w / 2 + 9 + i * 10, -h / 2 + 2 + (i % 2) * 2, 4, 2);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.5)'; rr(-w / 2 + 6, -h / 2 + 4, w - 12, 5, 3); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(91,70,96,.35)'; ctx.lineWidth = 1.5; rr(-w / 2, -h / 2, w, h, 10); ctx.stroke();
    face(0, 4, 13, br.blink < 0);
    ctx.restore();
  }

  function drawPaddle() {
    const w = paddle.w, h = paddle.h, x = paddle.x - w / 2, y = paddle.y, cx = paddle.x, cy = y + h / 2;
    ctx.save();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    for (const s of [-1, 1]) {
      const ex = cx + s * (w / 2 - 20);
      ctx.fillStyle = '#ffb3cf';
      ctx.beginPath(); ctx.moveTo(ex - 10, y + 5); ctx.lineTo(ex + s * 2, y - 12); ctx.lineTo(ex + 10, y + 5); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff7fa9';
      ctx.beginPath(); ctx.moveTo(ex - 4, y + 2); ctx.lineTo(ex + s, y - 6); ctx.lineTo(ex + 4, y + 2); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(91,70,96,.15)'; rr(x, y + 5, w, h, h / 2); ctx.fill();
    ctx.fillStyle = '#ffb3cf'; rr(x, y, w, h, h / 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(x + 10, y + 3, w - 20, 4, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,160,.55)';
    ctx.beginPath(); ctx.ellipse(cx - 17, cy + 3, 5, 3, 0, 0, Math.PI * 2); ctx.ellipse(cx + 17, cy + 3, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 13, cy + 1); ctx.lineTo(cx - 9.5, cy - 3); ctx.lineTo(cx - 6, cy + 1);
    ctx.moveTo(cx + 6, cy + 1); ctx.lineTo(cx + 9.5, cy - 3); ctx.lineTo(cx + 13, cy + 1);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - 2.5, cy + 2, 2.5, 0, Math.PI); ctx.arc(cx + 2.5, cy + 2, 2.5, 0, Math.PI); ctx.stroke();
    if (paddle.big > 0 && paddle.big < 2.5 && Math.floor(time * 8) % 2) {
      ctx.strokeStyle = '#fff'; rr(x - 3, y - 3, w + 6, h + 6, h / 2 + 3); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBall(b) {
    b.trail.forEach((p, i) => {
      ctx.globalAlpha = (i + 1) / b.trail.length * 0.3;
      ctx.fillStyle = PAL[i % PAL.length];
      ctx.beginPath(); ctx.arc(p.x, p.y, b.r * (0.4 + 0.6 * (i + 1) / b.trail.length), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    face(b.x, b.y + 1, b.r);
  }

  function drawItem(it) {
    const bob = Math.sin(it.t * 6) * 2, x = it.x, y = it.y + bob;
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (it.type === 'heart') { ctx.fillStyle = '#ff6f9c'; heartPath(x, y + 1, 18); ctx.fill(); }
    else if (it.type === 'star') { ctx.fillStyle = '#ffd23f'; starPath(x, y + 1, 10); ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke(); }
    else {
      ctx.fillStyle = '#7cc8ef';
      ctx.beginPath(); ctx.ellipse(x - 2, y, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 4, y); ctx.lineTo(x + 10, y - 5); ctx.lineTo(x + 10, y + 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x - 6, y - 1, 1.3, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(255,255,255,.8)'; rr(10, 10, W - 20, 50, 20); ctx.fill();
    ctx.strokeStyle = '#ffc6da'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffd23f'; starPath(34, 35, 10); ctx.fill();
    label(String(score), 50, 36, 24, INK, 'left', false);
    label(`STAGE ${level + 1}`, W / 2 - 20, 36, 20, '#c77dab', 'center', false);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i < lives ? '#ff6f9c' : 'rgba(91,70,96,.15)';
      heartPath(W - 160 + i * 22, 36, 20); ctx.fill();
    }
    label(muted ? '🔇' : '🔔', W - 36, 36, 20, INK, 'center', false);
  }

  function panel(y, h) {
    ctx.fillStyle = 'rgba(255,255,255,.92)'; rr(40, y, W - 80, h, 30); ctx.fill();
    ctx.strokeStyle = '#ffb3cf'; ctx.lineWidth = 3; ctx.stroke();
  }

  function mascot(x, y, r) {
    const by = y + Math.sin(time * 4) * 8;
    ctx.fillStyle = 'rgba(91,70,96,.12)';
    ctx.beginPath(); ctx.ellipse(x, y + r + 14, r * 0.8 * (1 - Math.sin(time * 4) * 0.1), 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, by, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    face(x, by + 3, r, Math.sin(time * 1.3) > 0.97);
  }

  function drawOverlay() {
    if (state === 'title') {
      ctx.fillStyle = 'rgba(255,240,246,.55)'; ctx.fillRect(0, 0, W, H);
      mascot(W / 2, 190, 42);
      panel(270, 300);
      label('말랑 벽돌깨기', W / 2, 322, 46, '#ff6f9c');
      label('말랑이를 튕겨서 사탕 벽돌을 깨 주세요!', W / 2, 372, 19);
      label('♥ 생명   ★ 분신술   🐟 패들 커짐', W / 2, 410, 17, '#9a7fa0');
      const p = 1 + Math.sin(time * 5) * 0.05;
      ctx.save(); ctx.translate(W / 2, 470); ctx.scale(p, p);
      ctx.fillStyle = '#ff8fb3'; rr(-120, -26, 240, 52, 26); ctx.fill();
      label('▶ 시작하기', 0, 1, 26, '#fff', 'center', false);
      ctx.restore();
      label('마우스·터치·←→ 이동 · P 쉬기 · M 소리', W / 2, 532, 15, '#9a7fa0', 'center', false);
      if (best) label(`최고 점수 ${best}`, W / 2, 610, 20, '#c77dab');
    } else if (state === 'pause') {
      ctx.fillStyle = 'rgba(255,240,246,.6)'; ctx.fillRect(0, 0, W, H);
      panel(280, 150);
      label('잠깐 쉬는 중… zZ', W / 2, 330, 32, '#c77dab');
      label('클릭하거나 P를 누르면 계속해요', W / 2, 380, 18);
    } else if (state === 'clear') {
      const p = 1 + Math.sin(time * 8) * 0.04;
      ctx.save(); ctx.translate(W / 2, 400); ctx.scale(p, p);
      label('스테이지 클리어! ✿', 0, 0, 40, '#ff6f9c');
      label('보너스 +100', 0, 48, 22, '#c77dab');
      ctx.restore();
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(255,240,246,.6)'; ctx.fillRect(0, 0, W, H);
      mascot(W / 2, 200, 36);
      panel(270, 290);
      label('앗, 말랑이가 다 떨어졌어요', W / 2, 320, 28, '#c77dab');
      label(`점수 ${score}`, W / 2, 375, 34, INK);
      label(score >= best && score > 0 ? '✨ 새 최고 기록! ✨' : `최고 점수 ${best}`, W / 2, 418, 20, '#ff6f9c');
      ctx.fillStyle = '#ff8fb3'; rr(W / 2 - 110, 456, 220, 52, 26); ctx.fill();
      label('다시 하기 ▶', W / 2, 483, 24, '#fff', 'center', false);
    }
    if (state === 'play' && balls.some(b => b.stuck)) {
      label('클릭 / 터치 / 스페이스로 발사!', W / 2, paddle.y - 60, 20, '#c77dab');
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 30, (Math.random() - 0.5) * shake * 30);
    drawBackground();
    bricks.forEach(drawBrick);
    items.forEach(drawItem);
    if (state !== 'title') { drawPaddle(); balls.forEach(drawBall); }
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      if (p.heart) { heartPath(p.x, p.y, p.size * 2); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (const t of texts) { ctx.globalAlpha = Math.min(1, t.t * 2); label(t.text, t.x, t.y, 18, t.color); }
    ctx.globalAlpha = 1;
    drawHUD();
    drawOverlay();
    ctx.restore();
  }

  // ---------- 입력 ----------
  function toCanvas(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }
  function primary() {
    if (state === 'title' || state === 'over') startGame();
    else if (state === 'pause') state = 'play';
    else if (state === 'play') launch();
  }
  addEventListener('pointermove', e => { targetX = toCanvas(e).x; });
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = toCanvas(e);
    if (p.y < 62 && p.x > W - 60) { muted = !muted; return; }
    targetX = p.x;
    primary();
  });
  addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys[k] = true;
    if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
    if (k === ' ' || k === 'Enter') primary();
    else if (k === 'p' || k === 'Escape') {
      if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play';
    } else if (k === 'm') muted = !muted;
  });
  addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

  // ---------- 루프 ----------
  buildLevel();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
